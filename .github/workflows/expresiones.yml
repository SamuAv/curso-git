name: Expresiones
run-name: Implementacion de Expresiones

on:
    workflow_dispatch:
        inputs:
            usuario:
                description: 'Nombre de usuario'
                required: true                
                type: string
            urgencia:
                description: 'Nivel de urgencia'
                required: true
                default: '1'
                type: choice
                options:
                    - '1'
                    - '2'
                    - '3'

jobs:
        pocaUrgencia:
            if: ${{ inputs.urgencia <= '2' }}
            runs-on: ubuntu-latest
            steps:
                - name: Ejecutar Script
                  run: echo ${{ inputs.usuario }} El problema es de poca urgencia

        muchaUrgencia:
            if: ${{ inputs.urgencia == '3' }}
            runs-on: ubuntu-latest
            steps:
                - name: Ejecutar Script
                  run: echo ${{ inputs.usuario }} El problema es de mucha urgencia