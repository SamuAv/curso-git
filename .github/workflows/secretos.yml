name: Variables y Secretos
run-name: Implementacion de Variables y Secretos

on:
    workflow_dispatch:
env:
    Dia_de_la_semana: Lunes

jobs:
    saludo_variables:
        runs-on: ubuntu-latest
        env:
            Saludo: Hola
        steps:
            - name: Saludar con Variables
              run: echo "$Saludo, ${{ vars.NOMBRE}}, Hoy es ${{ env.Dia_de_la_semana }}!"
    saludos_secretos:
        runs-on: ubuntu-latest
        steps:
            - name: Saludos Secretos
              run: echo "$Saludo, ${{ vars.NOMBRE }}, Tu contraseña es ${{ secrets.CONTRASENA }}!"
