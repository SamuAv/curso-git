name: Hola Mundo Java

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ejecutar-hola_mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Hacer checkout al repositorio
        uses: actions/checkout@v4

      - name: Ejecutar el script
        run: java hola_mundo.java