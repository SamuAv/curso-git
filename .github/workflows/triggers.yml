name: Triggers
run-name: Implementacion de Triggers

on:
  push:

    branches:
      - main
      - aprendiendo-github-actions

    paths:
      - '**.java'

  pull_request:
    types:
      [opened, labeled]
      branches:
        - main
      paths:
        - '**.java'

  issues:
    types: [opened, edited, closed]

  issue_comment:
    types: [created, deleted]

  workflow_dispatch:
    inputs:
      alerta:
        description: 'Nivel1'
        required: false
        default: medio
        type:
          choise: choise
          options:
            - bajo
            - medio

jobs:
  ejecutar-java:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' && github.event_name != 'issue_comment'

    steps:
      - name: Hacer checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Mostrar nivel de alerta
        if: github.event_name == 'workflow_dispatch'
        run: echo "Nivel de alerta: ${{ inputs.alerta }}"

      - name: Ejecutar el script
        run: java hola_mundo.java

  comentario-en-pr:
    name: Comentario en PR
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request

    steps:
      - name: Detectar comentario
        run: echo "Comentario en un Pull Request detectado"