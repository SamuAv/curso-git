name: Variables
run-name: Implementacion de Variables

on:
    workflow_dispatch:
env:
    Dia_de_la_semana: Lunes

jobs:
    saludo_variables:
        runs-on: ubuntu-latest
        env:
            Saludo: Hola
        steps:
            - name: Saludar con Variables
              run: echo "$Saludo, $NOMBRE hoy es $Dia_de_la_semana!"
              env:
                NOMBRE: Juan
